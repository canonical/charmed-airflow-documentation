charmed_airflow_architecture:
  - diagram_name: "Charmed Airflow"
    description: "High-level architecture of the Charmed Airflow deployment."
    mermaid_code: |
      graph LR
          subgraph Juju ["Juju Model"]
              Coordinator["airflow-coordinator-k8s"]
              API["airflow-api-server"]
              Scheduler["airflow-scheduler"]
              DAG["airflow-dag-processor"]
              Triggerer["airflow-triggerer"]
          end
          Coordinator -->|coordinates| API
          Coordinator -->|coordinates| Scheduler
          Coordinator -->|coordinates| DAG
          Coordinator -->|coordinates| Triggerer
    rendered_image: "../explanation/assets/architecture.png"
                  direction LR
                  PD -->|extend| Sphinx
              end
              Sphinx -->|builds| HTML[HTML]
          end
    rendered_image: "../explanation/assets/python-starter-pack.png"

  - diagram_name: "Extensions"
    description: "How built-in and third-party extensions are integrated and activated via requirements and conf.py."
    mermaid_code: |
      graph TD
          Python -->|installs the contents of| Reqs[/"requirements.txt"\]
          Reqs -->|specifies| ThirdParty["Third-party extensions"]
          Sphinx -->|provides| BuiltIn["Built-in Sphinx extensions"]
          subgraph Deps ["Various dependencies"]
              BuiltIn
              ThirdParty
          end
          BuiltIn -->|are activated in| Conf[/"Project configuration file (docs/conf.py)"\]
          ThirdParty -->|are activated in| Conf
    rendered_image: "../explanation/assets/extensions.png"

  - diagram_name: "Read the Docs"
    description: "Details the declaration of build logic in the RTD configuration file for hosting."
    mermaid_code: |
      graph TD
          Sphinx -->|is declared in| RTD_Conf[/"RTD configuration file (.readthedocs.yaml)"\]
          Conf_py["conf.py"] -->|is declared in| RTD_Conf
          Python_Ver["Python version"] -->|is declared in| RTD_Conf
          RTD_Conf -->|defines the build logic for| RTD["Read the Docs (RTD)"]
          RTD -->|builds and hosts| HTML[/"HTML"\]
    rendered_image: "../explanation/assets/rtd-build.png"

  - diagram_name: "Third-party extensions"
    description: "Focuses on the specific installation path for external dependencies via pip and requirements."
    mermaid_code: |
      graph TD
        Python[Python]
        Reqs[/"requirements.txt"\]
        Sphinx[Sphinx]
        subgraph Deps ["Various dependencies"]
            BuiltIn["Built-in Sphinx extensions"]
            ThirdParty["Third-party extensions"]
        end
        Python -->|installs the contents of| Reqs
        Reqs -->|specifies| ThirdParty
    rendered_image: "../explanation/assets/third-party-extensions.png"